<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polish — review session</title>
<link rel="stylesheet" href="/static/app.css">
<style>

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--line);
    background: var(--raised);
  }
  .bar {
    max-width: 44rem; margin: 0 auto; padding: .75rem 1.25rem;
    display: flex; align-items: baseline; gap: 1.5rem;
  }
  .brand { font-weight: 650; letter-spacing: -.01em; margin-right: auto; }
  .brand span { color: var(--accent); }
  .stat { font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stat b { color: var(--ink); font-weight: 650; }
  a.link { color: var(--accent); text-decoration: none; border-bottom: 1px solid transparent; }
  a.link:hover { border-bottom-color: var(--accent); }

  main {
    flex: 1; width: 100%; max-width: 44rem;
    margin: 0 auto; padding: 2rem 1.25rem 4rem;
    display: flex; flex-direction: column; gap: 1.25rem;
  }

  .rail { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .rail i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

  .node {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .09em;
    color: var(--faint); font-weight: 650;
  }

  .card {
    background: var(--raised); border: 1px solid var(--line);
    border-radius: 10px; padding: 1.75rem;
    display: flex; flex-direction: column; gap: 1rem;
  }
  .gloss { color: var(--muted); font-size: .95rem; }
  .sentence {
    font-family: ui-serif, Georgia, "Times New Roman", serif;
    font-size: 1.6rem; line-height: 1.4; text-wrap: balance;
  }
  .sentence input {
    font: inherit; width: 7.5em; padding: .1em .3em;
    background: transparent; color: var(--accent);
    border: 0; border-bottom: 2px solid var(--accent); border-radius: 0;
  }
  .sentence input.wide { width: 100%; }
  .sentence input:focus { outline: 2px solid var(--accent); outline-offset: 3px; }

  .audio { display: flex; gap: .5rem; }
  .audio button {
    font: inherit; font-size: .9rem; padding: .4rem .8rem; cursor: pointer;
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px;
  }
  .audio button:hover { border-color: var(--accent); color: var(--accent); }

  .choices { display: grid; gap: .5rem; }
  .choices button {
    font: inherit; text-align: left; padding: .7rem .9rem;
    background: var(--ground); color: var(--ink);
    border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
    font-family: ui-serif, Georgia, serif; font-size: 1.1rem;
  }
  .choices button:hover:not(:disabled) { border-color: var(--accent); }
  .choices button:disabled { cursor: default; opacity: .55; }
  .choices button.picked { border-color: var(--accent); border-width: 2px; opacity: 1; }

  .verdict { border-radius: 10px; padding: 1.1rem 1.25rem; display: none; gap: .5rem; flex-direction: column; }
  .verdict.show { display: flex; }
  .verdict.ok { background: var(--good-bg); border: 1px solid var(--good); }
  .verdict.err { background: var(--bad-bg); border: 1px solid var(--accent); }
  .verdict.warn { background: var(--warn-bg); border: 1px solid var(--warn); }
  .label { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; }
  .verdict.ok .label { color: var(--good); }
  .verdict.err .label { color: var(--accent); }
  .verdict.warn .label { color: var(--warn); }
  .why { font-size: 1rem; }
  .why em { font-family: ui-serif, Georgia, serif; font-style: normal; font-weight: 600; }

  /* Which cards this one answer moved — and which it deliberately did not. */
  .routed { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .15rem; }
  .chip {
    font-size: .72rem; padding: .2rem .55rem; border-radius: 999px;
    border: 1px solid var(--line); background: var(--raised); color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .chip b { color: var(--ink); font-weight: 650; }
  .chip.again { border-color: var(--accent); color: var(--accent); }
  .chip.good { border-color: var(--good); color: var(--good); }
  .chip.hard { border-color: var(--warn); color: var(--warn); }
  .chip.untouched { opacity: .7; font-style: italic; }
  /* Counted, but the schedule advances once a day — neither a pass, a failure,
     nor "this exercise does not test that". */
  .chip.earlier { border-style: dashed; opacity: .85; }

  .actions { display: flex; gap: .75rem; align-items: center; }
  button.primary {
    font: inherit; font-weight: 600; padding: .55rem 1.1rem;
    background: var(--accent); color: #fff; border: 0; border-radius: 7px; cursor: pointer;
  }
  button.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hint { font-size: .8rem; color: var(--faint); }

  .done { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .done h2 { font-family: ui-serif, Georgia, serif; color: var(--ink); margin: 0 0 .5rem; }
  .done .primary + .link { margin-left: 1rem; }

  /* Unlocking is the only moment in the loop where the course visibly opens up,
     so it is given real weight rather than a line of text. */
  .unlock {
    margin: 1.5rem auto; max-width: 30rem; text-align: left;
    background: var(--good-bg); border: 1px solid var(--good);
    border-radius: 10px; padding: 1.1rem 1.25rem;
  }
  .unlock .label { color: var(--good); margin-bottom: .35rem; }
  .unlock h3 {
    margin: 0; color: var(--ink); font-weight: 600;
    font-family: ui-serif, Georgia, serif; font-size: 1.25rem;
  }
  .unlock .what { margin: .4rem 0 0; font-size: .92rem; color: var(--muted); }

  /* One milestone, not three. Three progress bars is a dashboard, and a
     dashboard is not encouragement. */
  .milestone { margin: 1.5rem auto; max-width: 30rem; }
  .milestone .rail { margin-bottom: .5rem; }
  .milestone .what { margin: 0; font-size: .88rem; color: var(--muted); }
  .milestone .what strong { color: var(--ink); font-weight: 650; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* The lesson step: the shared lesson rules are in app.css; the card it sits
     in was built for one-line questions, so it needs a looser gap. */
  .card.lesson { gap: .4rem; text-align: left; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">polski<span>.</span></div>
    <div class="stat">streak <b id="s-streak">–</b></div>
    <div class="stat">due <b id="s-debt">–</b></div>
    <div class="stat">retained <b id="s-retained">–</b></div>
    <a class="stat link" href="/grammar">grammar</a>
    <a class="stat link" href="/progress">progress</a>
  </div>
</header>

<main>
  <div class="rail"><i id="rail"></i></div>
  <div id="stage"></div>
</main>

<script src="/static/common.js"></script>
  <script src="/static/session.js"></script>
</body>
</html>
