  cell: {number: sg, case: acc}
  submitted: ptak
  expect: ANIMACY

- id: animacy-gen-for-inanimate-stol
  lemma: stół
  cell: {number: sg, case: acc}
  submitted: stołu
  expect: ANIMACY
  note: The same misconception with the opposite sign — animate rule over-applied.

- id: animacy-gen-for-inanimate-sklep
  lemma: sklep
  cell: {number: sg, case: acc}
  submitted: sklepu
  expect: ANIMACY

- id: animacy-gen-for-inanimate-dom
  lemma: dom
  cell: {number: sg, case: acc}
