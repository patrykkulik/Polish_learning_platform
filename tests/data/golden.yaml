  expect: ANIMACY

- id: animacy-gen-for-inanimate-samochod
  lemma: samochód
  cell: {number: sg, case: acc}
  submitted: samochodu
  expect: ANIMACY
  note: Genitive here also carries the ó/o alternation, and is still a real form.

# ---------------------------------------------------------------- CASE_WRONG
- id: case-gen-for-acc-fem
  lemma: kawa
  cell: {number: sg, case: acc}
  submitted: kawy
  expect: CASE_WRONG
  note: Feminine, so the animacy rule must not fire.

- id: case-dat-for-acc-fem
  lemma: książka
  cell: {number: sg, case: acc}
  submitted: książce
  expect: CASE_WRONG

- id: case-nom-for-acc-matka
  lemma: matka
  cell: {number: sg, case: acc}
  submitted: matka
  expect: CASE_WRONG
  note: >
    A dropped ogonek that lands on another real form of the same lexeme is a case
    error, not a spelling slip. This is why step 2 precedes step 3.

- id: case-loc-for-gen-sklep
  lemma: sklep
  cell: {number: sg, case: gen}
  submitted: sklepie
  expect: CASE_WRONG
  note: Fails the pattern card; the morphological card must stay untouched.

- id: case-dat-for-gen-neuter
  lemma: okno
  cell: {number: sg, case: gen}
  submitted: oknu
  expect: CASE_WRONG

- id: case-gen-for-loc-krakow
  lemma: Kraków
  cell: {number: sg, case: loc}
  submitted: Krakowa
  expect: CASE_WRONG

- id: case-loc-for-inst-fem
  lemma: kawa
  cell: {number: sg, case: inst}
  submitted: kawie
  expect: CASE_WRONG

