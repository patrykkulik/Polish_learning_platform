# Golden corpus — the M0 kill-gate.
#
# Written before the classifier. These triples are the specification; writing
# them afterwards means writing them to fit whatever the code happens to do.
#
# Each case names a lexeme and a paradigm cell, the string a learner typed, and
# the class the grader must return. `partner` supplies the aspect partner's lemma
# where the case tests aspect, because M0 has no lexicon to look one up in.
#
# Gate: >= 60 cases, >= 5 per class, >= 95% overall, >= 80% within every class.

# ---------------------------------------------------------------- CORRECT
- id: correct-m3-acc-is-nom
  lemma: sklep
  cell: {number: sg, case: acc}
  submitted: sklep
  expect: CORRECT
  note: m3 accusative is syncretic with the nominative.

- id: correct-m2-acc-is-gen
  lemma: kot:Sm2
  cell: {number: sg, case: acc}
  submitted: kota
  expect: CORRECT
  note: >
    The tag is subst:sg:gen.acc:m2 — one interpretation covering both cases.
    Only set intersection accepts this; equality would call it CASE_WRONG.

- id: correct-fem-acc
  lemma: kawa
  cell: {number: sg, case: acc}
  submitted: kawę
  expect: CORRECT

- id: correct-fem-acc-ksiazka
  lemma: książka
  cell: {number: sg, case: acc}
  submitted: książkę
  expect: CORRECT

- id: correct-neuter-acc
  lemma: okno
  cell: {number: sg, case: acc}
  submitted: okno
  expect: CORRECT

- id: correct-nominative
  lemma: dom
  cell: {number: sg, case: nom}
  submitted: dom
  expect: CORRECT

- id: correct-after-normalisation
  lemma: sklep
  cell: {number: sg, case: acc}
  submitted: "  Sklep  "
  expect: CORRECT
  note: Step 0 normalises whitespace and case, and nothing else.

# ---------------------------------------------------------------- ANIMACY
- id: animacy-nom-for-animate-kot
  lemma: kot:Sm2
  cell: {number: sg, case: acc}
  submitted: kot
  expect: ANIMACY
  note: The masculine accusative trap, and the first hard concept in the course.

- id: animacy-nom-for-animate-pies
  lemma: pies
  cell: {number: sg, case: acc}
  submitted: pies
  expect: ANIMACY

- id: animacy-nom-for-animate-ptak
