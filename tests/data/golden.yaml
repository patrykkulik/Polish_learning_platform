# ------------------------------------------- CASE_RIGHT_FORM_WRONG
- id: paradigm-a-for-u-genitive
  lemma: sklep
  cell: {number: sg, case: gen}
  submitted: sklepa
  expect: CASE_RIGHT_FORM_WRONG
  note: >
    The -a genitive over-applied to a -u noun. Genitive *was* chosen correctly,
    so the pattern card passes and only the morphological card fails.

- id: paradigm-alternation-krakow
  lemma: Kraków
  cell: {number: sg, case: loc}
  submitted: Krakówie
  expect: CASE_RIGHT_FORM_WRONG
  note: >
    Criterion 4b. o->ó is the REVERSE of an ASCII fold, so step 3 must not fire.
    Revision 1 of the design listed o/ó as a bidirectional diacritic pair, which
    classified this as ORTHOGRAPHY and did not fail the grammar card.

- id: paradigm-alternation-stol
  lemma: stół
  cell: {number: sg, case: gen}
  submitted: stółu
  expect: CASE_RIGHT_FORM_WRONG
  note: Criterion 4b. The ó/o alternation left unapplied.

- id: paradigm-alternation-samochod
  lemma: samochód
  cell: {number: sg, case: gen}
  submitted: samochódu
  expect: CASE_RIGHT_FORM_WRONG
  note: Criterion 4b.

- id: paradigm-mobile-e-pies
  lemma: pies
  cell: {number: sg, case: gen}
  submitted: piesa
  expect: CASE_RIGHT_FORM_WRONG
  note: The mobile-e alternation regularised away — a real and common learner error.

- id: paradigm-y-for-i-matka
  lemma: matka
  cell: {number: sg, case: gen}
  submitted: matky
  expect: CASE_RIGHT_FORM_WRONG

- id: paradigm-invented-neuter-genitive
  lemma: okno
  cell: {number: sg, case: gen}
  submitted: oknia
  expect: CASE_RIGHT_FORM_WRONG

# ---------------------------------------------------------------- ORTHOGRAPHY
- id: ortho-ogonek-dropped-kawa
  lemma: kawa
  cell: {number: sg, case: acc}
  submitted: kawe
  expect: ORTHOGRAPHY

- id: ortho-two-folds-ksiazka
  lemma: książka
  cell: {number: sg, case: acc}
  submitted: ksiazke
  expect: ORTHOGRAPHY

- id: ortho-ogonek-dropped-matka
  lemma: matka
  cell: {number: sg, case: acc}
  submitted: matke
  expect: ORTHOGRAPHY
  note: >
    Genuinely ambiguous — the ogonek IS the accusative ending — and resolved
    leniently by design. The cost is recorded in the design document.

- id: ortho-kreska-dropped-krakow
  lemma: Kraków
  cell: {number: sg, case: nom}
  submitted: Krakow
  expect: ORTHOGRAPHY
  note: ó->o IS a fold in the learner's direction, unlike Krakówie above.

- id: ortho-two-folds-stol
  lemma: stół
  cell: {number: sg, case: nom}
  submitted: stol
  expect: ORTHOGRAPHY

- id: ortho-one-of-two-folds
  lemma: książka
  cell: {number: sg, case: nom}
  submitted: ksiażka
  expect: ORTHOGRAPHY

- id: ortho-homophone-u-for-o-kreska
  lemma: córka
  cell: {number: sg, case: nom}
  submitted: curka
  expect: ORTHOGRAPHY
  note: u/ó is a true homophone pair and stays bidirectional.

