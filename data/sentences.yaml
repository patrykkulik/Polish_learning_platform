# Authored sentences — the pipeline's generation stage, run offline and committed.
#
# The specification puts a language model here and forbids it on the request
# path. For a single learner running locally, the offline batch can simply be
# *authored*: the output is data, the runtime has no API key and no network
# call, and the validation stage that follows is identical either way. Nothing
# downstream can tell the difference, which is the point of `item.source`.
#
# Every entry is checked by pl.content.validate before it becomes an item —
# morphological parse, vocabulary whitelist, length bound, near-duplicate. An
# entry that fails is a build error, not a warning, because a sentence the
# learner cannot read routes its error to the grammar node it was meant to teach.
#
# `target` is the form the item drills. The rest of the sentence is context, and
# context is the whole reason these exist: a frame teaches the ending, a sentence
# teaches the ending somewhere a learner would actually meet it.

# ------------------------------------------------------------ accusative
- text: "Brat czyta książkę."
  target: książkę
  lemma: książka
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  gloss: "My brother is reading a book."

- text: "Codziennie piję wodę."
  target: wodę
  lemma: woda
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  gloss: "I drink water every day."

- text: "Widzę kota w parku."
  target: kota
  lemma: kot:Sm2
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  gloss: "I see a cat in the park."

- text: "Matka kupuje chleb i ser."
  target: chleb
  lemma: chleb
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  gloss: "Mother is buying bread and cheese."

- text: "Syn je jabłko."
  target: jabłko
  lemma: jabłko
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  gloss: "My son is eating an apple."

- text: "Siostra czyta gazetę."
  target: gazetę
  lemma: gazeta
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  gloss: "My sister is reading a newspaper."

