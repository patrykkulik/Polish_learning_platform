# The teaching surface: what a learner reads before they are drilled.
#
# A *concept* is not a node. The genitive is three nodes and one idea; the case
# system spans every node. A concept names the node that introduces it and the
# nodes that also teach it, so the genitive is explained once at N08 and pointed
# at by N09 and N10.
#
# Prose here is authored and wants the owner's review, like the sentence frames.
# The endings are not: every table below names a lexeme and the cases to show,
# and the surfaces are read out of the stored paradigm, so a table cannot be
# wrong unless SGJP is. That is the same guarantee acceptance criterion 16 gives
# the exercises, and it is why the tables carry the real alternations — `kot`'s
# accusative is literally the same cell as its genitive, which is what "borrows
# the genitive" means.
#
# Only a section's `body` is Markdown. A title, summary, heading or caption is
# shown exactly as typed, so write -a there, not `-a` — the build refuses a
# backtick or an asterisk in any of those four.
#
# Design: docs/design/teaching-surface.md.

#: The case, as a Polish classroom names it. `questions` is what makes a case
#: identifiable in a sentence — a learner who asks *kogo? czego?* and hears
#: `kota` has found the genitive without knowing any terminology.
cases:
  nom:
    polish: mianownik
    english: nominative
    questions: kto? co?
    gloss: who? what?
  gen:
    polish: dopełniacz
    english: genitive
    questions: kogo? czego?
    gloss: of whom? of what?
  dat:
    polish: celownik
    english: dative
    questions: komu? czemu?
    gloss: to whom? to what?
  acc:
    polish: biernik
    english: accusative
    questions: kogo? co?
    gloss: whom? what?
  inst:
    polish: narzędnik
    english: instrumental
    questions: (z) kim? (z) czym?
    gloss: with whom? with what?
  loc:
    polish: miejscownik
    english: locative
    questions: (o) kim? (o) czym?
    gloss: about whom? about what?
  voc:
    polish: wołacz
    english: vocative
    questions: o!
    gloss: calling someone

concepts:
  - key: VOCAB_GENDER
    title: Every noun is masculine, feminine or neuter
    introduced_by: V01
    summary: >-
      Learn each word together with its gender. The gender decides how the word
      changes later.
    sections:
      - heading: How to tell the gender
        body: |
          Every Polish noun is masculine, feminine or neuter. You need to know which, because the endings you add later depend on it. The last letter usually tells you:

          | the word ends in | gender | example |
          |---|---|---|
          | `-a` | feminine, almost always | `kawa` — coffee |
          | `-o` or `-e` | neuter, almost always | `okno` — window |
          | a consonant | masculine, usually | `sklep` — shop, `dom` — house |
      - heading: Watch out for these endings
        body: |
          After `c`, `cz`, `sz`, `rz`, `ż`, `l`, `j`, or a letter with an accent (`ś`, `ć`, `ń`), the word can be masculine or feminine.

          Masculine: `klucz` (key), `lekarz` (doctor), `hotel` (hotel). Feminine: `noc` (night), `rzecz` (thing), `twarz` (face), `mysz` (mouse), `sól` (salt), `wieś` (countryside). Learn the gender with the word.
      - heading: One more split, later
        body: |
          Masculine words for people and animals, like `brat` (brother) and `kot` (cat), change differently from masculine words for things, like `sklep` (shop). It is about grammar, not about being alive: `kurczak` (chicken) still counts as an animal when you buy it to eat. This gets its own lesson later.

  - key: CASES
    title: Odmiana przez przypadki — the seven cases
    introduced_by: N01
    also_taught_in: [N02]
    summary: >-
      In Polish, the end of a word changes to show what the word is doing in the
      sentence. Each of these forms is called a case, and there are seven.
    sections:
      - heading: Why endings change
        body: |
          In English, word order shows who does what: *the cat sees the dog* is not *the dog sees the cat*.

          Polish shows it with endings instead. `Kot widzi psa` means "the cat sees the dog". The ending of `psa` (dog) shows that the dog is the one being seen — so `Psa widzi kot` means the same thing. Word order is flexible; endings are not.
      - heading: The seven cases
        body: |
          Polish children learn each case with a question. Ask the question, and the answer takes that case.

          | case | question | used for |
          |---|---|---|
          | mianownik | kto? co? (who? what?) | the person or thing doing something |
          | dopełniacz | kogo? czego? (of whom? of what?) | "of", and after `nie` (not) |
          | celownik | komu? czemu? (to whom? to what?) | "to" or "for" someone |
          | biernik | kogo? co? (whom? what?) | the person or thing something is done to |
          | narzędnik | (z) kim? (z) czym? (with whom? with what?) | "with", and what someone is |
          | miejscownik | (o) kim? (o) czym? (about whom? about what?) | "about", and where something is |
          | wołacz | o! | calling someone |

          Mianownik is the form you find in a dictionary. The course teaches the others one at a time, the most useful first.
      - heading: One word in all seven cases
        body: |
          This is called a declension (odmiana). Most feminine words ending in `-a` follow the same pattern as `kawa` (coffee).
    tables:
      - lexeme: kawa
        caption: kawa (coffee) — feminine
        cases: [nom, gen, dat, acc, inst, loc, voc]
      - lexeme: sklep
        caption: sklep (shop) — masculine, a thing
        cases: [nom, gen, dat, acc, inst, loc, voc]

  - key: ACCUSATIVE
    title: Biernik — the thing you do something to
    introduced_by: N03
    also_taught_in: [N04]
    summary: >-
      Use biernik for the object of a verb: what you see, have or buy. Only some
      words change.
    sections:
      - heading: When to use it
        body: |
          Verbs like `widzieć` (to see), `mieć` (to have) and `kupować` (to buy) act on something. That something goes in biernik. Its question is *kogo? co?* (whom? what?).
      - heading: What changes
        body: |
          - Feminine words ending in `-a` change it to `-ę`: `kawa` (coffee) → `Mam kawę` (I have coffee).
          - Neuter words stay the same: `Widzę okno` (I see a window).
          - Masculine words for things stay the same: `Widzę sklep` (I see a shop).
          - Feminine words ending in a consonant stay the same: `Widzę mysz` (I see a mouse).

          Masculine words for people and animals work differently. They get their own lesson later.
      - heading: Why only the -a words change
        body: |
          The `-a` is an ending, so Polish swaps it for `-ę`. The other groups never had a separate object form, so the dictionary form does both jobs.
    tables:
      - lexeme: kawa
        caption: kawa (coffee) — feminine -a, changes
        cases: [nom, acc]
      - lexeme: noc
        caption: noc (night) — feminine, ends in a consonant, stays the same
        cases: [nom, acc]
      - lexeme: sklep
        caption: sklep (shop) — masculine thing, stays the same
        cases: [nom, acc]
      - lexeme: okno
        caption: okno (window) — neuter, stays the same
        cases: [nom, acc]

  - key: ANIMACY
    title: Masculine people and animals change as objects
    introduced_by: N05
    summary: >-
      Widzę sklep (I see a shop), but Widzę kota (I see a cat). A masculine word
      for a person or an animal changes when it is the object of a verb.
    sections:
      - heading: The rule
        body: |
          When a masculine word for a person or an animal is the object of a verb, it usually ends in `-a`:

          - `kot` (cat) → `Widzę kota` (I see a cat).
          - `pies` (dog) → `Widzę psa` (I see a dog).
          - `brat` (brother) → `Widzę brata` (I see my brother).

          Masculine words for things do not change: `Widzę sklep` (I see a shop), `Widzę komputer` (I see a computer).
      - heading: It is grammar, not biology
        body: |
          A chicken you buy to eat still counts as an animal: `Kupuję kurczaka` (I'm buying a chicken). A flower is alive, but it counts as a thing: `Widzę kwiat` (I see a flower).
      - heading: Why
        body: |
          Long ago, these words looked the same whether they were doing something or having something done to them. For people and animals, which can easily be either, that was confusing. So Polish borrowed another form — the genitive (dopełniacz), which you will learn later. The tables show it: for `kot` (cat), the genitive and the object form are the same word.
    tables:
      - lexeme: kot:Sm2
        caption: kot (cat) — an animal, so the object form is kota
        cases: [nom, gen, acc]
      - lexeme: pies:Sm2
        caption: pies (dog) — the middle of the word changes too
        cases: [nom, gen, acc]
      - lexeme: sklep
        caption: sklep (shop) — a thing, so it stays the same
        cases: [nom, gen, acc]

  - key: INSTRUMENTAL
    title: Narzędnik — with whom, with what, and what you are
    introduced_by: N07
    summary: >-
      Use narzędnik after z (with), and to say what someone is. The endings are
      simple: -em or -ą.
    sections:
      - heading: When to use it
        body: |
          - **Together with someone or something**: `Idę z bratem` (I'm going with my brother).
          - **Using something**: `Piszę długopisem` (I write with a pen).
          - **What someone is**: `Jestem nauczycielem` (I am a teacher).
      - heading: The endings
        body: |
          Masculine and neuter words add `-em`: `brat` (brother) → `bratem`, `okno` (window) → `oknem`. Feminine words change `-a` to `-ą`: `kawa` (coffee) → `kawą`.

          Words ending in `k` or `g` add `-iem`: `ptak` (bird) → `ptakiem`. Polish does not write `-kem`.
      - heading: I am a teacher
        body: |
          After `jestem` (I am), the job goes in narzędnik: `Jestem nauczycielem` (I am a teacher). After `to jest` (this is), it stays in the dictionary form: `To jest nauczyciel` (this is a teacher).
    tables:
      - lexeme: brat
        caption: brat (brother) — adds -em
        cases: [nom, inst]
      - lexeme: ptak
        caption: ptak (bird) — ends in k, adds -iem
        cases: [nom, inst]
      - lexeme: kawa
        caption: kawa (coffee) — -a becomes -ą
        cases: [nom, inst]
      - lexeme: okno
        caption: okno (window) — adds -em
        cases: [nom, inst]

  - key: GENITIVE
    title: Dopełniacz — of, none, and after small words
    introduced_by: N08
    also_taught_in: [N09, N10]
    summary: >-
      Use dopełniacz after nie (not), to say whose something is, and after words
      like do (to) and bez (without). You will use it a lot.
    sections:
      - heading: When to use it
        body: |
          - **After a negative verb**: `Mam czas` (I have time) → `Nie mam czasu` (I don't have time).
          - **To say whose something is**: `dom brata` (my brother's house). The owner comes second.
          - **After some prepositions**: `do` (to), `od` (from), `u` (at someone's), `dla` (for), `bez` (without), `obok` (next to) — `Idę do sklepu` (I'm going to the shop), `To jest dla brata` (this is for my brother).
      - heading: Why nie changes it
        body: |
          `Nie ma` means "there is none". Polish uses dopełniacz for amounts and parts of things — `dużo kawy` (a lot of coffee) — and "none" works the same way.
      - heading: Masculine endings
        body: |
          Masculine words end in `-u` or `-a`, and no simple rule tells you which: `sklep` (shop) → `sklepu`, but `chleb` (bread) → `chleba`. Learn each one with the word.
      - heading: Feminine and neuter endings
        body: |
          For feminine words, look at the letter before the final `-a`:

          - A soft consonant — `ć`, `ś`, `ź`, `ń`, `j`, `l`, or `ni`, `si`, `ci`, `zi` before a vowel — takes `-i`: `kuchnia` (kitchen) → `kuchni`, `restauracja` (restaurant) → `restauracji`.
          - `k` or `g` also takes `-i`, because Polish never writes `ky` or `gy`: `książka` (book) → `książki`.
          - Any other consonant takes `-y`: `kawa` (coffee) → `kawy`, `ulica` (street) → `ulicy`, `praca` (work) → `pracy`.

          Neuter words take `-a`: `okno` (window) → `okna`.
    tables:
      - lexeme: sklep
        caption: sklep (shop) — masculine, -u
        cases: [nom, gen]
      - lexeme: chleb
        caption: chleb (bread) — masculine, -a
        cases: [nom, gen]
      - lexeme: kawa
        caption: kawa (coffee) — feminine, hard consonant, -y
        cases: [nom, gen]
      - lexeme: kuchnia
        caption: kuchnia (kitchen) — feminine, soft consonant, -i
        cases: [nom, gen]
      - lexeme: książka
        caption: książka (book) — feminine, k before the -a, -i
        cases: [nom, gen]
      - lexeme: okno
        caption: okno (window) — neuter, -a
        cases: [nom, gen]
