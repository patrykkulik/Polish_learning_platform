# The M1 skill graph: a DAG, not a tree.
#
# `genders` on a grammar node selects which paradigm classes become pattern
# strata under it. The accusative splits three ways because the ending depends on
# gender and animacy — and the masculine animate node is deliberately downstream
# of the other two, because it is the first genuinely hard concept in the course
# and should not be met cold.

- key: V01
  type: vocabulary
  title: Everyday nouns
  cefr_level: A1
  prereqs: []
  explanation_md: |
    Polish nouns carry gender, and gender decides how the noun changes when its
    job in the sentence changes. Learn the word and its gender together — they
    are one fact, not two.

- key: N01
  type: grammar
  title: Gender and the nominative singular
  cefr_level: A1
  prereqs: [V01]
  rule_key: NOM_SG
  stratify_cases: [nom]
  genders: [f, m1, m2, m3, n]
  explanation_md: |
    The **nominative** is the dictionary form — the form a noun takes when it is
    the subject. Most nouns wear their gender on the ending: `-a` is almost
    always feminine, a consonant is almost always masculine, `-o` and `-e` are
    neuter.

- key: N02
  type: grammar
  title: Naming things — to jest
  cefr_level: A1
  prereqs: [N01]
  rule_key: NOM_PREDICATE
  stratify_cases: [nom]
  genders: [f, m1, m2, m3, n]
  explanation_md: |
    `To jest…` — *this is…* — takes the nominative, whatever the gender. `To` does
    not change to agree with anything.

- key: N03
  type: grammar
  title: Accusative singular — feminine
  cefr_level: A1
  prereqs: [N01]
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  stratify_cases: [nom, acc]
  genders: [f]
  explanation_md: |
    The **accusative** marks the direct object — the thing the verb acts on.
    Feminine nouns in `-a` take `-ę`: *kawa* → **kawę**.

- key: N04
  type: grammar
  title: Accusative singular — masculine inanimate and neuter
  cefr_level: A1
  prereqs: [N01]
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  stratify_cases: [nom, acc]
  genders: [m3, n]
  explanation_md: |
    Masculine **inanimate** nouns and all neuters look identical in the
    accusative and the nominative. Nothing changes: *Widzę **sklep***.

- key: N05
  type: grammar
  title: Accusative singular — masculine animate
  cefr_level: A1
  prereqs: [N03, N04]
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  stratify_cases: [nom, acc]
  genders: [m1, m2]
  explanation_md: |
    This is the one that catches everybody. A masculine noun that is **alive** —
    a person or an animal — borrows the *genitive* for its accusative:
    *kot* → **kota**, *pies* → **psa**.

    So *Widzę sklep* but *Widzę kota*. Same sentence shape, different ending,
    and the only thing that decides it is whether the noun is animate.

- key: N06
  type: function
  title: Saying what you have and what you see
  cefr_level: A1
  prereqs: [N02, N05]
  explanation_md: |
    Putting it together: naming something, then saying you have it or see it.
    Nothing new here — this composes what N02 and N03–N05 already taught.

# ---------------------------------------------------------------- case 3
# The specification's order puts the instrumental third on purpose: high
# utility, regular endings, and a confidence builder before the genitive.
- key: N07
  type: grammar
  title: Instrumental singular
  cefr_level: A1
  prereqs: [N06]
  rule_key: INST
  stratify_cases: [nom, inst]
  genders: [f, m1, m2, m3, n]
  explanation_md: |
    The **instrumental** answers *with what?* and *as what?*. It is the most
    regular case in the language: masculine and neuter take `-em`, feminine
    takes `-ą`. Almost nothing surprises you here.

    `Jestem nauczycielem` — *I am a teacher*. `Idę z bratem` — *I'm going with
    my brother*.

# ---------------------------------------------------------------- case 4
# The workhorse, split three ways as the specification requires. Teaching
# negation, possession and government in one node would be a bite too large.
- key: N08
  type: grammar
  title: Genitive after negation
  cefr_level: A1
  prereqs: [N07]
  rule_key: GEN_NEGATION
  stratify_cases: [nom, gen]
  genders: [f, m1, m2, m3, n]
  explanation_md: |
    Negate a verb that takes the accusative and its object switches to the
    **genitive**. `Mam czas` → `Nie mam czasu`. This is not optional and it has
    no equivalent in English, so it is worth over-practising.

- key: N09
  type: grammar
  title: Genitive for possession
  cefr_level: A1
  prereqs: [N08]
  rule_key: GEN_POSSESSION
  stratify_cases: [nom, gen]
  genders: [f, m1, m2, m3, n]
  explanation_md: |
    Polish has no *'s*. Possession runs the other way round, with the owner in
    the genitive after the thing owned: `dom brata` — *my brother's house*.

- key: N10
  type: grammar
  title: Genitive after prepositions
  cefr_level: A1
  prereqs: [N08]
  rule_key: GEN_PREPOSITION
  stratify_cases: [nom, gen]
  genders: [f, m1, m2, m3, n]
  explanation_md: |
    A large group of prepositions governs the genitive — `do`, `od`, `u`, `dla`,
    `bez`, `obok`, `według` and more. The preposition decides the case; the noun
    has no say in it.

# ---------------------------------------------------------------- case 5
- key: N11
  type: grammar
  title: Locative singular
  cefr_level: A1
  prereqs: [N10]
  rule_key: LOC_PREPOSITION
  stratify_cases: [nom, loc]
  genders: [f, m1, m2, m3, n]
  explanation_md: |
    The **locative** never appears without a preposition — `w`, `na`, `o`, `po`,
    `przy`. It is also where Polish consonant alternations show up in force:
    `Kraków → w Krakowie`, `książka → o książce`, `herbata → w herbacie`.

    Those alternations are the lesson, not an inconvenience around it.

# ---------------------------------------------------------------- aspect
# The specification calls this the single highest-value grammar node in the
# product, and it is deliberately not gated behind the later cases: aspect is
# taught from the first verb, not bolted on once the noun system is finished.
- key: N12
  type: grammar
  title: Aspect — ongoing or completed
  cefr_level: A1
  prereqs: [N06]
  rule_key: ASPECT_CHOICE
  pos: inf
  explanation_md: |
    Polish verbs come in pairs. The **imperfective** describes an action as
    ongoing, repeated or habitual; the **perfective** describes it as a single
    completed whole. English marks this with tense and context; Polish marks it
    by choosing a different verb.

    `Codziennie czytam` — *I read every day*, habitual, imperfective.
    `Wczoraj przeczytałem` — *yesterday I read it (and finished)*, perfective.

    There is no neutral choice. Every time you use a verb you are asserting one
    of these, so it is worth getting wrong often and early.

# ------------------------------------------------------------ themed vocabulary
# More words, without a longer road to the grammar. V01 gates N01 on 80% of its
# own words, so every noun added to V01 pushes the first grammar node back: 121
# more took N01 from day 20 to day 54 and left four nodes open in ninety days.
# Themed nodes own the new words instead, and open after N06 — once the
# accusative, the course's first hard concept, is done — because a vocabulary
# node open alongside the early grammar splits the day's new-card budget with
# it: opened straight after V01, they took N03 from day 41 to day 64.
#
# A lexeme names its node with `vocabulary_node`; the default is V01. Grammar
# introduces one of these words only after its meaning item (see
# `session.build_session`), which is what makes opening them late safe — and
# what makes a stratum populated only by their words a deadlock the build
# refuses (`frames.assert_every_stratum_is_reachable`).

- key: V02
  type: vocabulary
  title: Home and family
  cefr_level: A1
  prereqs: [N06]
  explanation_md: |
    The people in your life, the rooms you live in, and what is in them. Learn
    each word with its gender, as before — the endings you already know apply
    to all of them.

- key: V03
  type: vocabulary
  title: Food and shopping
  cefr_level: A1
  prereqs: [N06]
  explanation_md: |
    What you eat and drink, and where you buy it. Every word here fits the
    sentences you can already make: *Kupuję chleb*, *Nie mam cukru*, *Idę do
    piekarni*.
