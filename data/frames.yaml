# Authored frames. Items are frames x lexemes, resolved against the form table.
#
# No LLM is involved and no item is reviewed by hand: the expected surface is
# *looked up*, not written, so it cannot be wrong unless SGJP is wrong. That is
# what makes a few hundred items free at M1. Creative sentences serve
# communicative context, which is an M2 need, not a morphology-drilling one.
#
# `rule_key` plus the lexeme's derived paradigm_class resolves the pattern, and
# the pattern carries the node — so a frame does not name a node and does not
# need to know that the accusative splits three ways.
#
# ---------------------------------------------------------------------------
# `themes` keeps a frame off lexemes it would be nonsense with. Two rules govern
# its use here, and the second is a correctness requirement rather than taste.
#
# 1. Gate anything that reads as absurd. `Kupuję szkołę` ("I am buying the
#    school") inflects perfectly and teaches the learner to stop reading. This
#    matters more the larger the lexeme set gets: an ungated frame produces one
#    bad sentence per unsuitable noun, so nonsense scales exactly as fast as
#    vocabulary does.
#
# 2. **A rule that applies to every noun must keep one ungated frame.** Not to
#    avoid empty strata — gating cannot produce one. Strata are derived from the
#    frames that populate them, so a gated frame removes its stratum rather than
#    emptying it, and *that* is the danger: the node goes on building cleanly
#    while teaching fewer paradigm classes than the lexeme set contains, and
#    nothing anywhere reports it. `Verified:` gating every accusative frame to
#    `people` takes N04 from three strata to two and N05 from four to two, with
#    a successful build and a green stratum-coverage test.
#
#    So each universal rule keeps the one frame that genuinely fits any noun —
#    you can name, point at, like, lack or think about anything:
#
#      NOM_SG          NOM_CITATION     GEN_NEGATION     GEN_NIE_MA
#      NOM_PREDICATE   TO_JEST          LOC_PREPOSITION  LOC_O
#      ACC_AFTER_...   LUBIE
#
#    `test_the_universal_rules_still_reach_every_noun` is the guard. Rules that
#    are *not* universal — INST, GEN_POSSESSION, GEN_PREPOSITION — are wholly
#    theme-scoped on purpose: "Idę do ___" is a sentence about venues, and a
#    stratum it never reaches is a stratum that rule was never teaching.
#
# Themes are coarse, and coarse is the point — a curriculum author's tool, not a
# semantic model. A lexeme may carry several when it honestly belongs to several
# (`dom` is a venue you go to *and* a home you own); that is what keeps the gates
# from costing good sentences to exclude bad ones. Where a theme still mixes
# cases the frame excludes the whole theme and loses the good with the bad, which
# is the trade to revisit first if the sentences start reading thin.
# ---------------------------------------------------------------------------

# N01's competency is the citation form and the gender that comes with it. The
# nominative singular *is* the dictionary form, so there is no inflection to
# drill here — the producible skill is recalling the Polish word at all, in the
# form the dictionary lists it under. Without this frame N01 has strata and no
# items, which leaves it permanently unmasterable and every node downstream of
# it unreachable.
- key: NOM_CITATION
  exercise_type: cloze
  template: "___"
  gloss: "Write the Polish for “{gloss}”, in its dictionary form."
  case: nom
  rule_key: NOM_SG

- key: TO_JEST
  exercise_type: cloze
  template: "To jest ___."
  gloss: "This is the {gloss}."
  case: nom
  rule_key: NOM_PREDICATE

- key: TU_JEST
  exercise_type: cloze
  template: "Tu jest ___."
  gloss: "Here is the {gloss}."
  case: nom
  rule_key: NOM_PREDICATE
  # Locatable things. "Tu jest czas" is not a place to be.
  themes: [food, objects, home, clothes, venue, city, people, animals, nature]

- key: WIDZE
  exercise_type: cloze
  template: "Widzę ___."
  gloss: "I see the {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  # Visible things. You cannot see "czas" or "historia".
  themes: [food, objects, home, clothes, venue, city, people, animals, nature]

- key: MAM
  exercise_type: cloze
  template: "Mam ___."
  gloss: "I have the {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  # Ownable. Excludes venue: "Mam dom" is fine but "Mam kino" is not.
  themes: [food, objects, home, clothes, animals, people, abstract]

- key: LUBIE
  exercise_type: cloze
  template: "Lubię ___."
  gloss: "I like {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB

- key: KUPUJE
  exercise_type: cloze
  template: "Kupuję ___."
  gloss: "I am buying the {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  # Purchasable, and narrowly so.
  themes: [food, objects, home, clothes, animals]

# The preposition drill. `czekać na` governs the accusative regardless of what
# follows it, which makes it the cleanest vehicle in the M1 vocabulary for
# drilling government independently of the verb.
- key: CZEKAM_NA
  exercise_type: prep_drill
  template: "Czekam na ___."
  gloss: "I am waiting for the {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  # You wait for people, animals, an order, an event.
  themes: [people, animals, food, abstract]

# Multiple choice over forms: low-stakes first exposure to a stratum. Distractors
# are other real cells of the same lexeme, so a learner who guesses by shape
# rather than by rule gets it wrong.
- key: MCQ_ACC
  exercise_type: mcq
  template: "Widzę ___."
  gloss: "I see the {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  distractor_cases: [nom, gen, loc]
  # Same template as WIDZE, so the same gate.
  themes: [food, objects, home, clothes, venue, city, people, animals, nature]

# Multiple choice over meaning. Sits under the vocabulary node, so it scores the
# lexical card — the only vehicle at M1 that tests knowing the word rather than
# inflecting it.
- key: MCQ_MEANING
  exercise_type: mcq
  template: "Which word means “{gloss}”?"
  case: nom
  vocabulary: true
  distractor_lexemes: 3

# ------------------------------------------------------------ instrumental
# `themes` keeps a frame off lexemes it would be nonsense with. "Jestem
# sklepem" inflects correctly and means nothing; a morphology drill the learner
# cannot read as a sentence is a worse drill.
- key: INST_PREDICATE
  exercise_type: cloze
  template: "Jestem ___."
  gloss: "I am the {gloss}."
  case: inst
  rule_key: INST
  themes: [people]

- key: INST_WITH
  exercise_type: cloze
  template: "Idę z ___."
  gloss: "I am going with the {gloss}."
  case: inst
  rule_key: INST
  themes: [people, animals]

- key: INST_INTEREST
  exercise_type: cloze
  template: "Interesuję się ___."
  gloss: "I am interested in {gloss}."
  case: inst
  rule_key: INST
  themes: [abstract]

# ------------------------------------------------------------ genitive
- key: GEN_NIE_MAM
  exercise_type: cloze
  template: "Nie mam ___."
  gloss: "I do not have the {gloss}."
  case: gen
  rule_key: GEN_NEGATION
  # The negation of MAM, so the same gate.
  themes: [food, objects, home, clothes, animals, people, abstract]

- key: GEN_NIE_MA
  exercise_type: cloze
  template: "Nie ma ___."
  gloss: "There is no {gloss}."
  case: gen
  rule_key: GEN_NEGATION

- key: GEN_POSSESSOR
  exercise_type: cloze
  template: "To jest dom ___."
  gloss: "This is the {gloss}'s house."
  case: gen
  rule_key: GEN_POSSESSION
  themes: [people]

- key: GEN_DO
  exercise_type: cloze
  template: "Idę do ___."
  gloss: "I am going to the {gloss}."
  case: gen
  rule_key: GEN_PREPOSITION
  themes: [venue]

- key: GEN_DLA
  exercise_type: cloze
  template: "To jest dla ___."
  gloss: "This is for the {gloss}."
  case: gen
  rule_key: GEN_PREPOSITION
  themes: [people, animals]

# ------------------------------------------------------------ locative
- key: LOC_W
  exercise_type: cloze
  template: "Jestem w ___."
  gloss: "I am at the {gloss}."
  case: loc
  rule_key: LOC_PREPOSITION
  themes: [venue]

- key: LOC_O
  exercise_type: cloze
  template: "Myślę o ___."
  gloss: "I am thinking about the {gloss}."
  case: loc
  rule_key: LOC_PREPOSITION

# ------------------------------------------------------------ aspect
# The two options are the same cell of the two partners, so the learner is
# choosing an aspect and nothing else — not a tense, not a person, not a form
# they have to build. The context word carries the whole decision.
- key: ASPECT_HABITUAL
  exercise_type: aspect_choice
  template: "Codziennie on ___."
  gloss: "Every day — habitual, so not a single completed act. (to {gloss})"
  rule_key: ASPECT_CHOICE
  aspect: imperf
  cell: {pos: fin, number: sg, person: ter}

- key: ASPECT_COMPLETED
  exercise_type: aspect_choice
  template: "Wczoraj on ___."
  gloss: "Yesterday, and he finished it — one completed act. (to {gloss})"
  rule_key: ASPECT_CHOICE
  aspect: perf
  cell: {pos: praet, number: sg, gender: m1}

# --------------------------------------------------------- free translation
# The learner types the whole sentence, so nothing Polish appears in the prompt.
# `sentence` is the expected answer with {form} standing in for the inflected
# target; every other token is fixed context. This is the first exercise type
# that can produce WORD_ORDER or MISSING_CONSTITUENT, because it is the first
# where the learner controls more than one position.
- key: FREE_WIDZE
  exercise_type: free_translation
  template: ""
  sentence: "Widzę {form}"
  gloss: "Say in Polish: I see the {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  # Same sentence as WIDZE.
  themes: [food, objects, home, clothes, venue, city, people, animals, nature]

- key: FREE_MAM
  exercise_type: free_translation
  template: ""
  sentence: "Mam {form}"
  gloss: "Say in Polish: I have the {gloss}."
  case: acc
  rule_key: ACC_AFTER_TRANSITIVE_VERB
  # Same sentence as MAM.
  themes: [food, objects, home, clothes, animals, people, abstract]

- key: FREE_IDE_DO
  exercise_type: free_translation
  template: ""
  sentence: "Idę do {form}"
  gloss: "Say in Polish: I am going to the {gloss}."
  case: gen
  rule_key: GEN_PREPOSITION
  themes: [venue]
