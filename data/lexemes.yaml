# Verbs enter as aspect PAIRS, never singly. The specification is explicit that
# a learner must never meet an imperfective without its perfective partner,
# because the contrast is the lesson — an imperfective on its own teaches a word
# where the pair teaches a distinction English does not make.
- lemma: czytać
  gloss: to read (ongoing)
  theme: verbs
  pos: inf
  aspect_partner: przeczytać
- lemma: przeczytać
  gloss: to read (completed)
  theme: verbs
  pos: inf
  aspect_partner: czytać
- lemma: pisać
  gloss: to write (ongoing)
  theme: verbs
  pos: inf
  aspect_partner: napisać
- lemma: napisać
