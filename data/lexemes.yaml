# The M1 lexeme set: 44 nouns, hand-curated and theme-driven.
#
# Frequency is not the ordering principle. Frequency and teachability diverge
# badly in Polish — the most frequent nouns are disproportionately irregular, and
# a course that follows a frequency list teaches its hardest morphology first.
# Themes give the learner sentences that cohere; frequency breaks ties.
#
# `lemma` is the full Morfeusz identifier wherever the citation form is
# ambiguous. `kot` and `pies` each name two lexemes — the animal (m2) and a
# personal noun (m1) — and they are not interchangeable here: the accusative is
# the same, but the plural and the whole animacy lesson are not.
#
# The set is deliberately weighted to cover every accusative stratum with enough
# members that a pattern card has lexemes to draw from.

