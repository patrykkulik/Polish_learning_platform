# Consonant-final feminines (III declension). The accusative equals the
# nominative, which is a paradigm class the set had none of: all twenty other
# feminine nouns are -a/-ę. That gap is why N03 carried a single stratum and its
# one pattern card gated six nodes behind it.
- lemma: noc
  gloss: night
  theme: abstract
- lemma: sól
  gloss: salt
  theme: food
- lemma: wieś
  gloss: village
  theme: venue
  # "na wsi", not "we wsi" — same lexical government as uniwersytet. Note this
  # overrides a preposition the euphonic rule had just been taught to fix: `we`
  # was correct for `w`, and `na` is correct instead of `w`.
  locative_preposition: na

- lemma: mysz
  gloss: mouse
  theme: animals
- lemma: rzecz
  gloss: thing
  theme: objects
- lemma: twarz
