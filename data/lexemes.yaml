# Added for M2. The city and abstract themes give the genitive-preposition and
# locative frames somewhere to point; `kościół` is here specifically because its
# locative (`w kościele`) carries the ó/o alternation the design singles out.
- lemma: czas:S
  gloss: time
  theme: abstract
- lemma: muzyka
  gloss: music
  theme: abstract
- lemma: kino
  gloss: cinema
  theme: venue
- lemma: park
  gloss: park
  theme: venue
- lemma: hotel
  gloss: hotel
  theme: venue
- lemma: restauracja
  gloss: restaurant
  theme: venue
- lemma: biuro
  gloss: office
  theme: venue
- lemma: kościół
  gloss: church
  theme: venue
- lemma: uniwersytet
  gloss: university
  theme: venue
  # "na uniwersytecie", never "w uniwersytecie". Which preposition a place takes
  # is lexical — no rule derives it from the noun, so it is stored on the noun.
  locative_preposition: na

# Abstract nouns, so `interesować się` has something it can plausibly govern.
- lemma: historia
